name: Publish

# 태그 v*를 push하면 이 패키지를 GitHub Packages에 발행한다.
# 버전은 태그가 아니라 package.json의 version을 따른다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 발행 권한 토큰을 git 설정에 남기지 않는다. 설치·테스트 단계의 의존성 코드가 읽지 못하게 한다
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm 버전은 package.json의 packageManager를 따른다
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      # registry-url과 scope를 주면 setup-node가 NODE_AUTH_TOKEN을 읽는 .npmrc를 만든다
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@milvus-wina"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # 태그(v1.2.3)와 package.json version이 다르면 발행하지 않는다
      - name: 태그와 버전 확인
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "태그 $GITHUB_REF_NAME 와 package.json 버전 $version 이 다릅니다" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # 태그 checkout은 detached HEAD라 git 검사를 끈다. prepack이 dist/를 빌드한다
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
